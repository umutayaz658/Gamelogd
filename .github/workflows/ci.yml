name: Continuous Integration

on:
  push:
    branches: [ main, "feature/*", "fix/*" ]
  pull_request:
    branches: [ main ]

jobs:
  frontend-ci:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: frontend

      # Non-blocking for now: 56 pre-existing error-level violations remain (mostly
      # react-hooks/rules-of-hooks and setState-in-effect), tracked as separate follow-up work.
      # typescript.ignoreBuildErrors is off (Run Next.js Build below enforces it); only
      # eslint.ignoreDuringBuilds is still on. This surfaces the report; flip continue-on-error
      # to false once the remaining violations are cleared.
      - name: Run ESLint (report only)
        run: npm run lint
        working-directory: frontend
        continue-on-error: true

      - name: Run Next.js Build
        run: npm run build
        working-directory: frontend

  backend-ci:
    name: Backend Check & Migrations
    runs-on: ubuntu-latest
    # Tests run against real Postgres (same engine as production): SQLite would silently
    # no-op select_for_update and skip the partial unique constraints under test.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ci_db
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d ci_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: 'ci-secret-key-placeholder'
      DEBUG: 'True'
      DB_NAME: 'ci_db'
      DB_USER: 'ci_user'
      DB_PASSWORD: 'ci_password'
      DB_HOST: 'localhost'
      DB_PORT: '5432'
      CLOUDINARY_CLOUD_NAME: 'placeholder'
      CLOUDINARY_API_KEY: 'placeholder'
      CLOUDINARY_API_SECRET: 'placeholder'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Run Django System Checks
        run: python manage.py check
        working-directory: backend

      - name: Check for Uncreated Migrations
        run: python manage.py makemigrations --check --dry-run
        working-directory: backend

      # working-directory + explicit app label: running `python backend/manage.py test` from the
      # repo root used to discover 0 tests (backend/ is not a package), so the suite never
      # actually gated anything.
      - name: Run Django Tests
        run: python manage.py test api
        working-directory: backend
