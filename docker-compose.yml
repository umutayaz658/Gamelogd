services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=gamelogd
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/gamelogd
      - REDIS_URL=redis://redis:6379/0
      # This compose file is the local dev stack; DEBUG also unlocks the dev SECRET_KEY
      # fallback so the stack boots on a fresh clone without a backend/.env.
      - DEBUG=True
    env_file:
      # Copy backend/.env.example to backend/.env and fill it in; required: false lets the
      # stack still boot on a fresh clone (integrations simply stay disabled).
      - path: ./backend/.env
        required: false

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - WATCHPACK_POLLING=true
      - API_INTERNAL_URL=http://backend:8000/api
      # Browser-visible API base — requests from the user's browser go to the host-mapped
      # port, not the compose-internal hostname (see frontend/.env.example).
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
      - NEXT_PUBLIC_AUTH_MODE=header

volumes:
  postgres_data:
  media_data:
